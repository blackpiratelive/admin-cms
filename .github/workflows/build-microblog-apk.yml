name: Build Microblog APK (arm64)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-microblog/**'
      - '.github/workflows/build-microblog-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-microblog/**'
      - '.github/workflows/build-microblog-apk.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor Check
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile-microblog
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile-microblog
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: mobile-microblog
        run: flutter test

      - name: Build Android ARM64 Release APK
        working-directory: mobile-microblog
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microblog-arm64-release
          path: mobile-microblog/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
