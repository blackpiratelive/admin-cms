name: Build Microblog APK (arm64)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-microblog/**'
      - '.github/workflows/build-microblog-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-microblog/**'
      - '.github/workflows/build-microblog-apk.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor Check
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile-microblog
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile-microblog
        run: flutter analyze

      - name: Run Unit & Widget Tests
        working-directory: mobile-microblog
        run: flutter test

      - name: Configure Android Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Keystore secrets detected. Setting up release signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > mobile-microblog/android/app/release.jks
            cat <<EOF > mobile-microblog/android/key.properties
            storeFile=release.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
            EOF
            echo "Keystore successfully configured."
          else
            echo "Keystore secrets not set. Building with debug signing fallback."
          fi

      - name: Build Android ARM64 Release APK
        working-directory: mobile-microblog
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microblog-arm64-release
          path: mobile-microblog/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
